name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/hm ./cmd/hm
          sha256sum bin/hm > bin/hm.sha256
      - name: upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: hm-api-linux-amd64
          path: |
            backend/bin/hm
            backend/bin/hm.sha256
          if-no-files-found: error
          retention-days: 14
      - name: buf setup
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.75.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: build mp-weixin
        run: pnpm build:mp-weixin
      - name: upload mp-weixin
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin
          path: frontend/apps/mp/dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    needs: backend
    # PR 只做校验；镜像在 push main 或手动触发时构建
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_SHA::7}" \
            -t hm-api:"${GITHUB_SHA::7}" \
            -f backend/Dockerfile backend
          docker save hm-api:"${GITHUB_SHA::7}" | gzip -9 > hm-api-image.tar.gz
          sha256sum hm-api-image.tar.gz > hm-api-image.tar.gz.sha256
      - name: image info
        run: |
          docker image inspect hm-api:"${GITHUB_SHA::7}" --format 'id={{.Id}} size={{.Size}}'
          ls -lh hm-api-image.tar.gz
      - name: upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: hm-api-image
          path: |
            hm-api-image.tar.gz
            hm-api-image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
